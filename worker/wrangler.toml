name = "pool-controller"
main = "worker.js"
compatibility_date = "2024-01-01"

# Retains invocation logs so a transient failure can be diagnosed after the fact
# instead of guessed at. Included on the free plan.
[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "POOL_KV"
id = "2136abf5520f4e30a81ff914ee736f1e"
